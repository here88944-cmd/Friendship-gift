<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Friendship Day! 💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #0d0d12;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }
    .sticker {
      position: absolute;
      width: 45px;
      height: 45px;
      pointer-events: none;
    }
    .st-1 { top: 5%; left: 5%; }
    .st-2 { top: 5%; right: 5%; }
    .st-3 { bottom: 5%; left: 5%; }
    .st-4 { bottom: 5%; right: 5%; }

    .card {
      background: #18181e;
      border: 1px solid #3d3b4e;
      border-radius: 20px;
      padding: 25px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }
    .photo-grid img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #3d3b4e;
    }
    .name {
      color: #a29bfe;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    .message {
      background: #121216;
      padding: 15px;
      border-radius: 12px;
      border-left: 3px solid #a29bfe;
      text-align: left;
      font-size: 0.9rem;
      color: #ddd;
      line-height: 1.5;
    }
    .back-btn {
      display: inline-block;
      margin-top: 15px;
      color: #aaa;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Floating GIFs/Stickers -->
  <img src="https://media.giphy.com/media/26fldmqsA5edc55e0/giphy.gif" class="sticker st-1" alt="sparkle">
  <img src="https://media.giphy.com/media/l41YfykEffZ7QM55m/giphy.gif" class="sticker st-2" alt="heart">
  <img src="https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif" class="sticker st-3" alt="star">
  <img src="https://media.giphy.com/media/3o7TKoWXm3okO1kgHC/giphy.gif" class="sticker st-4" alt="flower">

  <!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="yaariyan.mp3" type="audio/mpeg">
</audio>


  <div class="card">
    <button class="music-btn" onclick="toggleMusic()" id="mBtn">🎵</button>

    <div class="photo-grid">
      <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80" alt="Photo 1">
      <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=500&q=80" alt="Photo 2">
    </div>

    <h1>Happy Friendship Day!</h1>
    <h2 class="name" id="friendName">Friend</h2>

    <div class="message">
      <p>Thank you for being such an incredible friend! Wishing you endless joy, success, and continuous smiles always! 🌟💖</p>
    </div>

    <a href="index.html" class="back-btn">← Back to start</a>
  </div>

  <script>
    // Extract the name from the URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const passedName = urlParams.get('name');
    if (passedName) {
      document.getElementById('friendName').innerText = passedName + " ✨";
    }

    // Audio Control
    const audio = document.getElementById("bgMusic");
    let isPlaying = false;

    function toggleMusic() {
      const btn = document.getElementById("mBtn");
      if (isPlaying) {
        audio.pause();
        btn.innerText = "🔇";
        isPlaying = false;
      } else {
        audio.play();
        btn.innerText = "🎵";
        isPlaying = true;
      }
    }

    // Trigger Confetti on Load
    window.onload = () => {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    };
  </script>

</body>
</html>
