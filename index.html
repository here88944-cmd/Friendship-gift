<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Surprise For You ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #0d0d12;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #18181e;
      border: 1px solid #3d3b4e;
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3d3b4e;
      background: #121216;
      color: #fff;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>A Surprise Awaits 🎁✨</h1>
    <p>Enter your name below to unlock your Friendship Day message!</p>
    <input type="text" id="friendName" placeholder="Type your name...">
    <button onclick="goToSurprise()">Open Surprise 💖</button>
  </div>

  <script>
    function goToSurprise() {
      const name = document.getElementById('friendName').value.trim();
      if (!name) {
        alert("Please enter your name!");
        return;
      }
      // Redirects to surprise.html and passes the name in the URL
      window.location.href = "surprise.html?name=" + encodeURIComponent(name);
    }
  </script>

</body>
</html>
